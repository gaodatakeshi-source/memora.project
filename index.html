ty='u';it={id:nid(),t:today(),k:'Pengeluaran',n,c,d:'Dari perintah suara',w:'Cash'};msg=`Pengeluaran ${rp(n)} buat ${c}, sudah dicatat. Benar?`}

else if(/catat/.test(s)){const i=s.replace(/^.*?catat(an)?/,'').trim()||s;ty='c';it={id:nid(),t:today(),j:i.slice(0,40),i};msg=`Catatan "${i}", sudah dicatat. Benar?`}

D[ty].push(it);save();LV={ty,id:it.id};const o=$('vr');if(o)o.innerHTML=`<div class="card"><p>${e(msg)}</p>${btn('Benar',"$('vr').innerHTML=''")}${btn('Salah, Batalkan',"vu()",'Salah, batalkan catatan ini','s')}</div>`;speak(msg)}

if(A||jn=='Pengalaman')D.p.filter(f).forEach(x=>R.push({jn:'Pengalaman',t:x.t,j:x.j,i:`Siapa: ${x.s}. Dimana: ${x.d}. ${x.a} Pelajaran: ${x.l}`,n:'',k:x.n,g:''}));
if(A||jn=='Catatan Biasa')D.c.filter(f).forEach(x=>R.push({jn:'Catatan',t:x.t,j:x.j,i:x.i,n:'',k:'',g:''}));
if(A||jn=='Hutang dan Piutang')D.h.filter(f).forEach(x=>R.push({jn:'Hutang',t:x.t,j:x.jn+' - '+x.nm,i:x.d+' Jatuh tempo: '+(x.jt||'-')+'. Sisa '+rp(sisa(x)),n:x.n,k:sisa(x)<=0?'Lunas':'Belum lunas',g:''}));
if(A||jn=='Daftar Centang')D.l.filter(f).forEach(x=>R.push({jn:'Daftar',t:x.t,j:x.j,i:x.items.map(q=>(q.d?'[x] ':'[ ] ')+q.x).join('; '),n:'',k:prog(x),g:''}));
return R.sort((a,b)=>(b.t||'')>(a.t||'')?1:-1)}
function exCsv(){const jn=$('xj').value,R=rows(jn,$('xm').value);if(!R.length)return say('Tidak ada data untuk diekspor.');const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
dl('memora-'+jn.replace(/ /g,'-').toLowerCase()+'-'+today()+'.csv','\ufeff'+['Jenis,Tanggal,Judul,Isi,Nominal,Info,Tag',...R.map(r=>[r.jn,r.t,r.j,r.i,r.n,r.k,r.g].map(q).join(','))].join('\r\n'),'text/csv');say(`File CSV ${R.length} baris sudah diunduh.`,'s')}
const wrap=(t,n)=>{const o=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{while(w.length>n){if(l){o.push(l);l=''}o.push(w.slice(0,n));w=w.slice(n)}if((l+' '+w).trim().length>n){o.push(l);l=w}else l=(l+' '+w).trim()});o.push(l)});return o};
function mkPdf(I){const W=595,H=842,M=40,P=[],esc=x=>x.replace(/[^\x20-\xFF]/g,'?').replace(/([()\\])/g,'\\$1');let c=[],y=H-M;
I.forEach(it=>{const h=it.k=='h',h2=it.k=='h2',sz=h?15:h2?11:9,lh=h?22:h2?16:12,n=h?55:h2?70:94;wrap(it.t,n).forEach(l=>{if(y<M+lh){P.push(c);c=[];y=H-M}c.push(`BT /F${h||h2?2:1} ${sz} Tf ${M} ${y} Td (${esc(l)}) Tj ET`);y-=lh})});if(c.length||!P.length)P.push(c);
let out='%PDF-1.4\n',off=[];const add=b=>{off.push(out.length);out+=off.length+' 0 obj\n'+b+'\nendobj\n'};
add('<</Type/Catalog/Pages 2 0 R>>');add('<</Type/Pages/Kids['+P.map((_,i)=>(5+i*2)+' 0 R').join(' ')+']/Count '+P.length+'>>');add('<</Type/Font/Subtype/Type1/BaseFont/Courier/Encoding/WinAnsiEncoding>>');add('<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>');
P.forEach((a,i)=>{const st=a.join('\n')+`\nBT /F1 8 Tf ${M} 20 Td (Halaman ${i+1} dari ${P.length}) Tj ET`;add(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents ${6+i*2} 0 R>>`);add(`<</Length ${st.length}>>\nstream\n${st}\nendstream`)});
const xr=out.length;out+='xref\n0 '+(off.length+1)+'\n0000000000 65535 f \n'+off.map(x=>String(x).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${off.length+1}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`;return new Uint8Array(Array.from(out,ch=>ch.charCodeAt(0)))}
function exPdf(){const jn=$('xj').value,m=$('xm').value,R=rows(jn,m);if(!R.length)return say('Tidak ada data untuk diekspor.');
const I=[{k:'h',t:'Memora - Laporan '+jn},{k:'b',t:'Periode: '+(m||'Semua tanggal')+'. Dibuat: '+today()},{k:'b',t:''}];
if(jn=='Keuangan'||jn=='Semua Data'){const t=tot();I.push({k:'h2',t:'Ringkasan Keuangan (semua waktu)'},{k:'b',t:'Pemasukan '+rp(t.i)+' | Pengeluaran '+rp(t.o)+' | Sisa '+rp(t.s)},{k:'b',t:DP.map(w=>w+' '+rp(bal(w))).join(' | ')},{k:'b',t:''})}
R.forEach(r=>{I.push({k:'h2',t:`${r.t||''}  ${r.jn}: ${r.j}`});if(r.n!=='')I.push({k:'b',t:'Nominal: '+rp(r.n)});if(r.k)I.push({k:'b',t:'Info: '+r.k});if(r.i)I.push({k:'b',t:r.i});if(r.g)I.push({k:'b',t:'Tag: '+r.g});I.push({k:'b',t:''})});
dl('memora-laporan-'+jn.replace(/ /g,'-').toLowerCase()+'-'+today()+'.pdf',mkPdf(I),'application/pdf');say(`File PDF ${R.length} catatan sudah diunduh.`,'s')}
function go(p,a){cur=p;cp=a;$('sh').hidden=true;stop();$('pg').innerHTML='<section>'+V[p](a)+'</section>';if(P[p])P[p](a);navr();scrollTo(0,0);const h=document.querySelector('#pg h1');if(h)h.focus()}
function dl(n,s,ty){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:ty}));a.download=n;document.body.appendChild(a);a.click();a.remove()}catch(_){say('Unduhan gagal di perangkat ini.')}}
async function bk(x){dl('memora-backup-'+today()+'.'+x,await bkStr(),x=='json'?'application/json':'text/plain');D.s.lb=today();D.s.bn=0;save();go(cur,cp);say('File backup sudah diunduh. Silakan buka Google Drive, upload file ini ke folder Memora agar aman saat ganti HP. File ini berisi semua catatan kamu.','s')}
function pul(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{let x=JSON.parse(r.result);const fo=x.foto;x=x.data||x;if(!Array.isArray(x.j)||!Array.isArray(x.u)||!Array.isArray(x.p))throw 0;D=x;norm();if(fo){for(const k of await IDB.all())await IDB.del(k);for(const k in fo)await IDB.put(k,fo[k])}save();ap();go('home');say(`Data berhasil dipulihkan. Total ${D.j.length} jurnal, ${D.u.length} transaksi uang, ${D.p.length} pengalaman, ${D.c.length} catatan biasa.`)}catch(_){say('File backup tidak bisa dibaca. Pilih file yang benar.')}ev.target.value=''};r.readAsText(f)}
function exTxt(){const R=a=>[...a].sort((x,y)=>y.t>x.t?1:-1);let s='MEMORA - SEMUA DATA (TERBARU DULU)\n\nJURNAL\n';
R(D.j).forEach(x=>s+=`${x.t} | ${x.m} | ${x.j}\n${x.i}\nTag: ${(x.g||[]).join(', ')}\n\n`);s+='KEUANGAN\n';
R(D.u).forEach(x=>s+=`${x.t} | ${x.k} | ${x.n} | ${x.c} | ${x.w||'Cash'} | ${x.d}\n`);s+='\nCATATAN BIASA\n';
R(D.c).forEach(x=>s+=`${x.t} | ${x.j}\n${x.i}\n\n`);s+='PENGALAMAN\n';
R(D.p).forEach(x=>s+=`${x.t} | ${x.j} | Siapa: ${x.s} | Dimana: ${x.d}\n${x.a}\nPelajaran: ${x.l}\nNilai: ${x.n}\n\n`);s+='\nDAFTAR CENTANG\n';D.l.forEach(l=>s+=`${l.j}: ${l.items.map(q=>(q.d?'[x] ':'[ ] ')+q.x).join('; ')}\n`);s+='\nHUTANG DAN PIUTANG\n';D.h.forEach(h=>s+=`${h.jn} | ${h.nm} | ${h.n} | sisa ${sisa(h)} | jatuh tempo ${h.jt||'-'} | ${h.d}\n`);s+='\nANGGARAN\n';Object.keys(D.s.bud).forEach(c=>s+=bTxt(c)+'\n');dl('memora-semua-data-'+today()+'.txt',s,'text/plain');say('File teks sudah diunduh.','s')}
function sPin(){const p=$('np').value;if(!/^\d{4}$/.test(p))return say('PIN harus 4 angka.');D.s.pin=p;save();$('np').value='';say('PIN aktif.','s')}

function cek(){const m=[],t=tagih();if(t&&D.s.tn!=today()){D.s.tn=today();save();m.push(t);vib('l')}
const w=D.s.lastRing,d=w?(new Date(today()+'T00:00')-new Date(w+'T00:00'))/864e5:99;if(d>=7&&D.j.length+D.u.length+D.p.length){const x=tot();D.s.lastRing=today();save();m.push(`Catatan minggu lalu: ${D.j.filter(y=>inW(y.t)).length} jurnal, pengeluaran ${rp(x.w)}, ${D.p.filter(y=>inW(y.t)).length} pengalaman baru.`)}
if(D.s.jr&&new Date().getHours()>=20&&D.s.jn!=today()&&!D.j.some(x=>x.t==today())){D.s.jn=today();save();m.push('Waktunya menulis jurnal hari ini.');vib('s')}
