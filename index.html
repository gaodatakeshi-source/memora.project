<script>

j:[['j','Judul','text',0,1],['i','Isi Cerita','ta',0,1],['m','Mood','sel',MD],['g','Tag','tags']],c:[['j','Judul','text',0,1],['i','Isi','ta',0,1]],
p:[['j','Judul pengalaman','text',0,1],['t','Tanggal','date'],['s','Siapa','text'],['d','Dimana','text'],['a','Apa yang terjadi','ta',0,1],['l','Pelajaran yang didapat','ta',0,1],['n','Nilai','sel',NV]],
t:[['fr','Dari dompet','sel',DP],['to','Ke dompet','sel',DP],['n','Nominal','number']]};

let D={j:[],u:[],p:[],c:[],tr:[],s:DS()},cur='home',cp,FS,TF=[],uid=Date.now();

const save=()=>{try{localStorage.setItem('lumina',JSON.stringify(D));localStorage.setItem('lumina_tema',D.s.tema)}catch(_){say('Penyimpanan gagal.')}};
let tm;function say(t,v){const o=$('tt');o.textContent=t;o.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>{o.classList.remove('on');o.textContent=''},6000);if(v)vib(v)}
function vib(t){try{if(D.s.vib&&navigator.vibrate)navigator.vibrate(t=='l'?[300,150,300]:[60])}catch(_){}}
function stop(){try{speechSynthesis.cancel()}catch(_){}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.15)}catch(_){}}
function speak(t){say(t);try{if(!D.s.sv)return;if(D.s.mesin=='senyap')return vib('s');if(D.s.mesin=='beep')return beep();stop();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.rate={Lambat:.7,Normal:1,Cepat:1.4}[D.s.kec]||1;const v=speechSynthesis.getVoices().find(x=>x.name==D.s.vs);if(v)u.voice=v;speechSynthesis.speak(u)}catch(_){}}
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>ymd(new Date()),rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const inW=d=>{const f=(new Date(today()+'T00:00')-new Date(d+'T00:00'))/864e5;return f>=0&&f<7},addD=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)};
const btn=(l,f,a,c)=>`<button${c?` class="${c}"`:''} aria-label="${e(a||l)}" onclick="${f}">${e(l)}</button>`;
const fld=(id,l,m,ta,v)=>`<label for="${id}">${l}</label>${ta?`<textarea id="${id}" aria-label="${l}">${e(v)}</textarea>`:`<input id="${id}" aria-label="${l}" value="${e(v)}">`}${m?btn('Isi dengan suara '+l,`mic('${id}','${l}',this)`,'','s'):''}`;
const sel=(id,l,o,v,oc)=>`<label for="${id}">${l}</label><select id="${id}" aria-label="${l}"${oc?` onchange="${oc}"`:''}>${(v&&!o.includes(v)?[v,...o]:o).map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`;
const on=v=>v?'ON':'OFF',tglF=()=>new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function mic(id,name,b,after){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return say('Browser ini tidak mendukung suara, silakan ketik manual.');
const old=b.textContent;try{const r=new SR();r.lang='id-ID';r.continuous=false;b.textContent='MENDENGARKAN... SILAKAN BICARA';say('Mendengarkan, silakan bicara');
r.onresult=ev=>{const t=ev.results[0][0].transcript,el=$(id);el.value=(el.value&&!after?el.value+' ':'')+t;say(name+' terisi: '+t);after&&after()};
r.onerror=()=>say('Suara tidak terdengar, coba lagi.');r.onend=()=>{b.textContent=old};r.start()}catch(_){b.textContent=old;say('Suara gagal dimulai, silakan ketik manual.')}}
function ap(){document.documentElement.style.fontSize={Kecil:'14px',Sedang:'16px','Besar Sekali':'32px'}[D.s.font]||'16px';document.body.classList.toggle('big',D.s.font=='Besar Sekali');document.body.dataset.t=D.s.tema}
function ganti(){D.s.tema=D.s.tema=='gelap'?'terang':'gelap';ap();save();go(cur,cp);say('Tema diganti ke '+(D.s.tema=='gelap'?'Gelap':'Terang'))}
function tags(t){const sw=new Set('yang dan atau dengan untuk dari pada saya aku tadi hari ini itu juga tapi karena sudah akan tidak bisa kami kita mereka ada lagi sangat banget udah mau jadi dalam seperti'.split(' ')),c={};(t.toLowerCase().match(/[a-z]{4,}/g)||[]).forEach(w=>{if(!sw.has(w))c[w]=(c[w]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,3)}
function tot(){const t=today(),m=t.slice(0,7);let h=0,w=0,b=0,i=0,o=0,bi=0;D.u.forEach(x=>{const n=+x.n||0;if(x.k=='Pemasukan'){i+=n;if(x.t.slice(0,7)==m)bi+=n}else{o+=n;if(x.t==t)h+=n;if(inW(x.t))w+=n;if(x.t.slice(0,7)==m)b+=n}});return{h,w,b,i,o,s:i-o,bi}}
const bal=w=>D.u.filter(x=>(x.w||'Cash')==w).reduce((a,x)=>a+(x.k=='Pemasukan'?1:-1)*(+x.n||0),0)+D.s.tf.reduce((a,x)=>a+(x.to==w?+x.n:0)-(x.fr==w?+x.n:0),0);
function tgt(){if(!D.s.target)return'Target tabungan belum diatur.';const t=tot(),s=Math.max(0,t.bi-t.b),p=Math.min(100,Math.round(s/D.s.target*100));return`Sudah terkumpul ${p} persen, tinggal ${rp(Math.max(0,D.s.target-s))} lagi.`}
function tagih(){const d=new Date();d.setDate(d.getDate()+1);const r=D.s.tagihan.filter(x=>x.d==d.getDate()).map(x=>x.n);return r.length?'Peringatan: besok ada tagihan '+r.join(', ')+'.':''}

R(D.j).forEach(x=>s+=`${x.t} | ${x.m} | ${x.j}\n${x.i}\nTag: ${(x.g||[]).join(', ')}\n\n`);s+='KEUANGAN\n';
R(D.u).forEach(x=>s+=`${x.t} | ${x.k} | ${x.n} | ${x.c} | ${x.w||'Cash'} | ${x.d}\n`);s+='\nCATATAN BIASA\n';
R(D.c).forEach(x=>s+=`${x.t} | ${x.j}\n${x.i}\n\n`);s+='PENGALAMAN\n';
R(D.p).forEach(x=>s+=`${x.t} | ${x.j} | Siapa: ${x.s} | Dimana: ${x.d}\n${x.a}\nPelajaran: ${x.l}\nNilai: ${x.n}\n\n`);dl('memora-semua-data-'+today()+'.txt',s,'text/plain');say('File teks sudah diunduh.','s')}
function sPin(){const p=$('np').value;if(!/^\d{4}$/.test(p))return say('PIN harus 4 angka.');D.s.pin=p;save();$('np').value='';say('PIN aktif.','s')}
function hPin(){D.s.pin='';save();say('PIN dimatikan.')}
function hapus(){if(!confirm('Yakin hapus semua data?'))return;if(!confirm('Benar-benar yakin? Data tidak bisa kembali.'))return;try{localStorage.clear()}catch(_){}D={j:[],u:[],p:[],c:[],tr:[],s:DS()};ap();go('home');say('Semua data sudah dihapus.')}
function notif(t){try{if('Notification' in window&&Notification.permission=='granted')new Notification('Memora',{body:t})}catch(_){}}
function aktifNotif(){if(!('Notification' in window))return say('HP ini belum mendukung notifikasi sistem. Pengingat tampil di dalam aplikasi.');Notification.requestPermission().then(p=>say(p=='granted'?'Notifikasi sistem aktif.':'Notifikasi tidak diizinkan.'))}
function cek(){const m=[],t=tagih();if(t&&D.s.tn!=today()){D.s.tn=today();save();m.push(t);vib('l')}
const w=D.s.lastRing,d=w?(new Date(today()+'T00:00')-new Date(w+'T00:00'))/864e5:99;if(d>=7&&D.j.length+D.u.length+D.p.length){const x=tot();D.s.lastRing=today();save();m.push(`Catatan minggu lalu: ${D.j.filter(y=>inW(y.t)).length} jurnal, pengeluaran ${rp(x.w)}, ${D.p.filter(y=>inW(y.t)).length} pengalaman baru.`)}
if(D.s.jr&&new Date().getHours()>=20&&D.s.jn!=today()&&!D.j.some(x=>x.t==today())){D.s.jn=today();save();m.push('Waktunya menulis jurnal hari ini.');vib('s')}
if(m.length){say(m.join(' '));notif(m.join(' '))}navr()}
function lock(){if(D.s.pin){$('lock').hidden=false;$('app').hidden=true;say('Aplikasi terkunci. Masukkan PIN 4 angka.')}}
function bukaPin(){if($('pin').value===D.s.pin){$('lock').hidden=true;$('app').hidden=false;$('pin').value='';go('home');cek()}else say('PIN salah, coba lagi.')}
norm();ulang();ap();
$('pg').addEventListener('input',()=>{if(cur=='cari')rc();if(cur=='uang')rul()});
$('pg').addEventListener('change',()=>{if(cur=='cari')rc();if(cur=='uang')rul()});
go('home');lock();
if(D.s.ab&&bdue()&&!D.s.pin){dl('memora-backup-'+today()+'.txt',JSON.stringify({app:'memora',tanggal:today(),data:D}),'text/plain');D.s.lb=today();D.s.bn=1;save();go('home');say('Backup mingguan sudah jadi, tolong simpan ke Drive ya.')}
cek();setInterval(cek,60000);
